# Redshift Environment Configuration - DYNAMIC SELECTION
# Environments are now selected via console prompt (1=test, 2=dev, 3=prod)
environments:
  test:
    host: "redshift.test.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"
  dev:
    host: "redshift.dev.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"
  prod:
    host: "redshift.prod.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"

paths:
  ddl_base_path: "Fetch_Object_Output"           # Base path - code handles rest
  log_directory: "Create_Object_Output/Logs"
  output_directory: "Create_Object_Output"       # Base output - code handles rest

# Object Configuration - WILL BE SET DYNAMICALLY VIA CONSOLE PROMPTS
object_config:
  schema_name: "mktg_ops_tbls"           # Schema name to match folder prefix (prompted at runtime)
  object_type: "table"                   # Will be set dynamically via prompt (1=table, 2=view, 3=procedure)
  run_identifier: ""                     # Will be generated based on user selection
  environment: "dev"                     # Will be set dynamically via prompt

# Execution Configuration
execution:
  retry_failed_objects: true    # Retry objects that failed due to dependency issues
  max_retries: 3                # Maximum number of retry attempts for dependency errors
  batch_size: 50                # Number of objects to process before logging progress