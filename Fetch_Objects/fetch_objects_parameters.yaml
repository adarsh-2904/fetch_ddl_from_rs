# Redshift Environment Configuration - DYNAMIC SELECTION
# Environments are now selected via console prompt (1=test, 2=dev, 3=prod)
environments:
  test:
    host: "redshift.test.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"
  dev:
    host: "redshift.dev.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"
  prod:
    host: "redshift.prod.datahub.redcross.net"
    port: 5439
    dbname: "mods_bi"

# Paths Configuration (using relative paths from project root)
paths:
  log_directory: "Fetch_Object_Output/Logs"       # Where log files will be created

# Object Configuration - WILL BE SET DYNAMICALLY VIA CONSOLE PROMPTS
object_config:
  schema_name: "mktg_ops_tbls"           # Schema to fetch DDL files from (prompted at runtime)
  object_type: "procedure"               # Will be set dynamically via prompt (1=table, 2=view, 3=procedure)
  run_identifier: ""                     # Will be generated based on user selection
  environment: "dev"                     # Will be set dynamically via prompt
  mode: "all"                            # Options: "all", "selected"